name: AppImage

# Builds the Linux AppImage on Ubuntu 22.04. The bundle takes glibc from the
# user's system and starts only where glibc is at least as new as on the build
# machine, so it must be built on the oldest system it targets — 22.04, which
# is also what the AppImage catalog tests on. See packaging/linux/BUILD.md.

on:
  workflow_dispatch:
  pull_request:
    branches: ["master", "main"]
    paths:
      - "packaging/linux/**"
      - ".github/workflows/appimage.yml"
      - "requirements.txt"

jobs:
  appimage:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # setup-python's interpreters for ubuntu-22.04 are built on 22.04, so
      # the libpython that PyInstaller bundles needs no newer glibc.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyInstaller copies system libraries from this machine into the bundle,
      # so whatever Qt's xcb plugin and QtWebEngine link against must be
      # installed here — a missing one only shows up as a "Library not found"
      # warning, and then as a crash on the user's machine. libpulse0 is for
      # QtMultimedia (the splash video).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libasound2 \
            libpulse0

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Build AppImage
        shell: bash
        run: bash packaging/linux/build_appimage.sh 2>&1 | tee build.log

      - name: Report libraries PyInstaller could not find
        if: always()
        shell: bash
        run: |
          if grep -q "Library not found" build.log; then
            grep "Library not found" build.log | sort -u | while read -r line; do
              echo "::warning::${line}"
            done
          else
            echo "No missing libraries."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ComfyLauncher-AppImage
          path: packaging/linux/ComfyLauncher-x86_64.AppImage
          if-no-files-found: error
